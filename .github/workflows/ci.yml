name: CI and Deploy RSX Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar tipos
        run: npm run typecheck

      - name: Ejecutar tests
        run: npm test

  deploy:
    name: Deploy producción
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Preparar SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/rsxhub_deploy"
          chmod 600 "$HOME/.ssh/rsxhub_deploy"

          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Desplegar en el servidor
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
        run: |
          ssh \
            -i "$HOME/.ssh/rsxhub_deploy" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            webrsx@"$PROD_HOST" \
            /home/webrsx/bin/deploy-rsxhub